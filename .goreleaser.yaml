# GoReleaser builds the archives, the checksums and the GitHub release.
# The signed Windows build and the package managers (Homebrew, Scoop, npm) come after it, in
# .github/workflows/release.yml, so that they can use the signed files.
version: 2

project_name: mcpsh

before:
  hooks:
    - go mod download

builds:
  - id: mcpsh
    main: ./cmd/mcpsh
    binary: mcpsh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/davidemaggi/mcpsh/internal/version.Version={{ .Version }}
      - -X github.com/davidemaggi/mcpsh/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/davidemaggi/mcpsh/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mcpsh
    ids: [mcpsh]
    # install.sh, install.ps1, Homebrew, Scoop and npm all rely on this name
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # The license of every dependency compiled in: `go-licenses save` writes it before the build
      # (see the release workflow)
      - third_party/**/*

snapshot:
  # CI builds snapshots to test the installers and packages; keep the version SemVer-shaped
  version_template: "{{ incpatch .Version }}-snapshot"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: davidemaggi
    name: mcpsh
  prerelease: auto
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
